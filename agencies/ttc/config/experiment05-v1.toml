# Experiment 05 v1. Derived from the frozen 04c final matcher configuration.
# Calendar/service dates are runtime inputs. No date-specific decision rules.
schema_version = "experiment05-config-v1"
allowed_routes = ["29"]
match_modes = ["global", "early", "middle", "late"]

[inputs]
avl_path = "database_offline/avl/20240401_Vehicle GPS Rt29 RT 929 Nov 2023.csv"
apc_path = "database_offline/apc/ttc_apc_data.csv"
feed_manifest_path = "artifacts/feed_manifest.draft.csv"
feed_gtfs_root = "database_offline/gtfs"

[normalization]
timezone = "America/Toronto"
service_date_hypothesis_early_hours = 6
observation_window = "local_calendar_day"
ambiguous_timestamp_policy = "retain_diagnostic_do_not_guess_fold"
vehicle_id_policy = "trim_preserve_identifier"
device_id_policy = "null_unless_source_field_exists"

[projection]
numerical_chunk_gap_s = 1800.0
reset_at_raw_direction_change = true

[segmentation]
joint_gap_s = 1800.0
direction_confirm_points = 3
direction_confirm_duration_s = 20.0
terminal_radius_m = 150.0
progress_reset_m = 500.0
minimum_points = 1

[plateau]
atomic_window_s = 60.0
minimum_window_points = 2
max_adjacent_gap_s = 120.0
canonical_still_range_m = 30.0
raw_still_radius_m = 25.0
raw_moving_distance_m = 80.0
raw_moving_speed_mps = 1.0
frozen_coordinate_epsilon_m = 0.05
frozen_min_points = 8
frozen_speed_conflict_kph = 5.0
minimum_plateau_s = 180.0
terminal_radius_m = 150.0
recovery_lookahead_s = 900.0
recovery_progress_m = 150.0
recovery_min_points = 3
censor_min_duration_s = 600.0
censor_max_duration_s = 1800.0
censor_headway_multiplier = 1.5
censor_terminal_dwell_allowance_s = 300.0
counterfactual_advance_m = 250.0
counterfactual_min_candidates = 1
counterfactual_delay_prior_window_s = 180.0
counterfactual_min_prior_points = 3
counterfactual_prior_min_progress_m = 50.0
counterfactual_delay_mad_max_s = 120.0
counterfactual_delay_growth_s_per_s = 0.1
counterfactual_rescue_delay_s = 3600.0
apc_meaningful_activity_min = 1.0
apc_colocation_radius_m = 75.0

[apc]
attach_time_buffer_s = 120.0
attach_progress_tolerance_m = 200.0
visit_merge_gap_s = 30.0
maximum_service_interval_s = 1800.0

[execution]
workers = 8
cache_success_only = true
persist_alignment_traces = false

[export]
tides_version = "1.0"
passenger_event_policy = "omit_without_event_semantics"
include_vehicles = true
include_devices = false

