[project]
name = "ttc-tides"
version = "0.1.0"
description = "Offline TTC source-data to TIDES conversion prototype"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "frictionless>=5.18,<6",
    "polars>=1,<2",
    "pyarrow>=16",
]

[project.scripts]
ttc-tides = "ttc_tides.cli:main"

[dependency-groups]
dev = [
    "pytest>=8,<9",
    "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ttc_tides"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88
# Frozen release snapshots under releases/ are hash-pinned historical copies.
# Linting them is meaningless and writes caches into pinned directories.
extend-exclude = ["releases"]

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
