<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Experiment 05 · Transit Workbench</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div><p class="eyebrow">TTC · ROUTE 29</p><h1 data-i18n="title">实验05 · 运行工作台</h1><p data-i18n="subtitle">从原始观测到三轮锁定分配与TIDES导出</p></div>
    <button id="language-switch" type="button" aria-label="Switch language">English</button>
  </header>
  <main>
    <section class="panel" aria-labelledby="run-heading">
      <h2 id="run-heading" data-i18n="newRun">运行实验</h2>
      <form id="run-form">
        <div class="controls">
          <label><span data-i18n="date">数据日期</span><select id="service-date" required><option value="" data-i18n="loadingDates">加载可用日期…</option></select></label>
          <label><span data-i18n="route">线路</span><select id="route"><option value="29">29</option></select></label>
          <label><span data-i18n="mode">匹配模式</span><select id="match-mode"><option value="all" data-i18n="all">全部四种模式</option><option value="global" data-i18n="global">全局</option><option value="early" data-i18n="early">前期</option><option value="middle" data-i18n="middle">中期</option><option value="late" data-i18n="late">后期</option></select></label>
          <button id="run-button" type="submit" disabled data-i18n="run">开始处理</button>
        </div>
        <div class="run-options"><label class="check"><input id="force" type="checkbox"><span data-i18n="force">强制重新处理（保留已有结果）</span></label><p id="availability-note" class="muted" aria-live="polite"></p></div>
      </form>
      <p class="notice" data-i18n="notice">每次只运行一个任务；可复用的成功结果由同一处理管线验证后读取。分配结果不等于经过校准的真实trip确认。</p>
      <details><summary data-i18n="availability">原始数据与GTFS可用性</summary><div id="availability-table" class="table-wrap"></div></details>
    </section>
    <div id="error" role="alert" hidden></div>
    <section class="panel" aria-labelledby="job-heading">
      <div class="section-heading"><h2 id="job-heading" data-i18n="progress">处理进度</h2><span id="job-status" class="badge" data-i18n="idle">尚未运行</span></div>
      <p id="job-id" class="muted"></p>
      <ol id="stage-progress"><li class="muted" data-i18n="progressEmpty">开始后显示各阶段的实际状态与行数。</li></ol>
    </section>
    <section class="panel" aria-labelledby="history-heading">
      <div class="section-heading"><h2 id="history-heading" data-i18n="history">已保存的运行</h2><button id="refresh-runs" type="button" class="secondary" data-i18n="refresh">刷新</button></div>
      <div id="run-list" class="run-list"></div>
    </section>
    <section id="result-panel" class="panel" hidden aria-labelledby="result-heading">
      <div class="section-heading"><h2 id="result-heading" data-i18n="result">结果与导出</h2><span id="validator-status" class="badge"></span></div>
      <p id="result-run-id" class="muted"></p>
      <div id="summary-metrics" class="metrics"></div>
      <div id="mode-results" class="mode-grid"></div>
      <details><summary data-i18n="stageCounts">阶段行数</summary><div id="stage-counts" class="table-wrap"></div></details>
      <details open><summary data-i18n="downloads">下载CSV / Parquet / JSON</summary><div class="download-toolbar"><label><span data-i18n="format">格式</span><select id="download-filter"><option value="all" data-i18n="allFormats">全部格式</option><option value="csv">CSV</option><option value="parquet">Parquet</option><option value="json">JSON</option></select></label></div><div id="downloads" class="download-list"></div></details>
      <details><summary data-i18n="rawSummary">完整摘要</summary><pre id="summary-json"></pre></details>
    </section>
  </main>
  <footer data-i18n="footer">仅本机访问 · 不使用外部资源 · 下载前校验发布文件SHA-256</footer>
</body>
</html>
