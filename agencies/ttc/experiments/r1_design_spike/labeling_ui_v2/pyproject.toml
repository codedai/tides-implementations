[project]
name = "ttc-labeling-ui-v2"
version = "2.0.0"
description = "Blind second-pass human labeling UI (protocol v2) for the r1 spike scheduled_trip cases"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.37,<2",
    "polars>=1,<2",
    "numpy>=1.26",
    "pyarrow>=16",
    "plotly>=5.22,<7",
    # pandas 3's default arrow-backed strings segfault under streamlit's
    # script-runner thread with this pyarrow/polars combination; pandas 2
    # avoids that native path entirely
    "pandas>=2,<3",
]

[dependency-groups]
dev = [
    "pytest>=8,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]
