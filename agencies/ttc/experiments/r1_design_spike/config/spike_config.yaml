# Run configuration for the R1 design-validation spike.
# Every threshold is experimental and unapproved. Units are explicit in
# key names (_s seconds, _m metres, _n counts).

profile: diagnostic-experimental-r1-spike
publishable: false
tides_conformance_claimed: false
authorization_basis: >-
  experimental design-validation spike; not ADR-approved S3+ production

timezone: America/Toronto   # EXPERIMENTAL run assumption (G0.3 open):
                            # source wall times treated as naive local

inputs:
  normalized_dir: artifacts/diagnostic-2026-08-06/normalized
  gtfs_artifact_dirs:
    # service_date -> gtfs artifact directory (generated by the existing
    # `ttc-tides gtfs process` CLI; candidate-manifest override recorded
    # as an assumption because no feed is formally approved yet)
    "2023-11-04": artifacts/gtfs-2023-11-04-ttc-d092742e6a5b
    "2023-11-05": artifacts/gtfs-2023-11-05-ttc-d092742e6a5b
    "2023-11-27": artifacts/gtfs-2023-11-27-ttc-de8294439596
    "2023-11-28": artifacts/gtfs-2023-11-28-ttc-de8294439596
    "2023-11-29": artifacts/gtfs-2023-11-29-ttc-de8294439596
    "2023-11-30": artifacts/gtfs-2023-11-30-ttc-de8294439596
    "2023-12-01": artifacts/gtfs-2023-12-01-ttc-de8294439596

slices:
  normal_day:
    description: ordinary operations; legacy default diagnostic day
    avl_dates: ["2023-11-28"]
    apc_dates: ["2023-11-28"]
    service_date_candidates: ["2023-11-27", "2023-11-28"]
    wall_start: "2023-11-28 00:00:00"
    wall_end: "2023-11-28 23:59:59"
    vehicles_n: 3
  dst_fall_back:
    description: 2023-11-05 fall-back window, both folds retained
    avl_dates: ["2023-11-04", "2023-11-05"]
    apc_dates: ["2023-11-04", "2023-11-05"]
    service_date_candidates: ["2023-11-04", "2023-11-05"]
    # starts before midnight so cross-midnight continuity and pre-window
    # fold anchors are both present
    wall_start: "2023-11-04 23:30:00"
    wall_end: "2023-11-05 03:30:00"
    vehicles_n: 3
  month_boundary:
    description: right-censored month end; APC beyond AVL fixture end
    avl_dates: ["2023-11-30"]
    apc_dates: ["2023-11-30", "2023-12-01"]
    service_date_candidates: ["2023-11-29", "2023-11-30", "2023-12-01"]
    wall_start: "2023-11-30 22:00:00"
    wall_end: "2023-12-01 02:30:00"
    vehicles_n: 3

segmentation:
  max_continuity_gap_s: 1800        # X4-A split threshold (experimental)
  x4b_debounce_pings_n: 5           # X4-B sustained-change debounce
  x4b_debounce_span_s: 120
  resolution_variant: x4b           # variant fed into candidate/resolution
                                    # stages. The x4a run (recorded as
                                    # evidence) produced day-scale segments
                                    # that overflow the trip-hypothesis cap
                                    # by construction; x4b's debounced
                                    # context splits give trip-scale
                                    # segments that exercise the scoring
                                    # path. Neither variant is approved.

time:
  fold_max_gap_s: 1800              # XT-FOLD-A anchor-continuity bound

geometry:
  soft_bound_m: 50.0                # unapproved experimental bounds
  hard_bound_m: 250.0

temporal:
  interpolation_max_gap_s: 300      # bracketing-ping interpolation limit
  candidate_prefilter_gap_s: 7200   # generation-time prefilter, wider than
                                    # every variant's contract hard bound so
                                    # all variants see identical candidate
                                    # sets and stale rejection is scored,
                                    # not silently pre-pruned

candidates:
  schedule_window_expansion_s: 1800 # scheduled-trip shortlist overlap pad
  segment_hypothesis_cap: 128       # measured: a cap of 24 fails closed on
                                    # 21/24 trip-scale segments of this
                                    # 5-10-min-headway route (see findings);
                                    # 128 lets the scoring path run while
                                    # the overflow evidence stays recorded
  apc_candidate_cap: 64
  component_record_cap: 400

stage1:
  policy: policy_b                  # policy_a | policy_b | policy_c
  policy_b_min_support_records: 2   # below this: avl_only regime

windows:
  window_hours: 24
  window_hours_alt: 12              # second window size for §14 comparison
  orders: [forward, reverse, shuffled]
  shuffle_seed: 20261107            # deterministic shuffle

score_contract:
  path: experiments/r1_design_spike/config/experimental_score_contract.yaml
  variants: [conservative, permissive, forced_diagnostic]
  primary_variant: conservative
